version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app/backend
      - ./server.js:/app/server.js
      - ./data:/app/data
    working_dir: /app
    command: npm run dev

volumes:
  data:
    driver: local
